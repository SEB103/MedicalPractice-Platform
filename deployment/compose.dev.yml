# LOCAL DEVELOPMENT ONLY. No real patient information or internet exposure.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicalpractice_dev
      POSTGRES_USER: medicalpractice
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicalpractice -d medicalpractice_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev:
