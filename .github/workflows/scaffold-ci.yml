name: Product scaffold CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scaffold-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scaffold metadata and clean Product structure
        run: python scripts/validate_scaffold.py
      - name: Warn this is NOT application build/test
        run: echo 'Scaffold validation only; Django and Quasar applications have not been initialized.'
