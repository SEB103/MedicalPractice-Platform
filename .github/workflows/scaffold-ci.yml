name: Product scaffold CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scaffold-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate scaffold metadata and clean Product structure
        run: python scripts/validate_scaffold.py
      - name: Clarify validation scope
        run: echo 'This job checks only the Product scaffold; Quasar build/tests are handled by pages.yml. Django backend remains scaffold-only.'
